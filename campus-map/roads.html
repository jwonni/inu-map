<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[임시] 도로망 오버레이 — 캠퍼스 층별 안내</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .osm-panel {
      position: absolute; left: 16px; top: 76px; z-index: 25; background: #fff; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 10px 14px; font-size: 13px; line-height: 1.9;
    }
    .osm-panel b { display: block; font-size: 12px; color: #888; margin-bottom: 2px; }
    .osm-panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .osm-panel .sw { width: 26px; height: 0; border-top: 4px solid; display: inline-block; }
    /* OSM 레이어 스타일 */
    .osm-road-edge { stroke: #4a4a4a; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .osm-road { stroke: #fff7e6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .osm-road.main { stroke: #ffe9b8; }
    .osm-ped { stroke: #f7d2a8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .osm-foot { stroke: #c66a2c; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 2.5 2; }
    .osm-steps { stroke: #8e44ad; stroke-linecap: butt; fill: none; stroke-dasharray: 1.2 1.2; }
    .osm-boundary { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    #mapSvg.hide-hand #handRoads { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">N</span> 캠퍼스 층별 안내 <span style="color:#e74c3c;font-size:12px;margin-left:6px">[임시] OSM 도로망</span></div>
    <div class="search">
      <input id="searchInput" type="text" placeholder="건물·호실 검색 (예: 7호관 403호, 14호관 202)" autocomplete="off" />
      <ul id="searchResults" class="search-results"></ul>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" id="mapWrap">
      <div class="map" id="map">
        <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" width="962" height="841" role="img" aria-label="인천대학교 송도캠퍼스 카툰 지도"></svg>
        <div class="hotspots" id="hotspots"></div>
      </div>
      <div class="map-controls">
        <button data-zoom="in" title="확대">＋</button>
        <button data-zoom="out" title="축소">－</button>
        <button data-zoom="reset" title="원래대로">⟲</button>
      </div>
      <div class="osm-panel" id="osmPanel">
        <b>OSM 도로망 (inu_pixel.json)</b>
        <label><input type="checkbox" data-layer="road" checked /><span class="sw" style="border-color:#4a4a4a"></span>차도 (service / residential)</label>
        <label><input type="checkbox" data-layer="ped" checked /><span class="sw" style="border-color:#f7d2a8"></span>보행자 도로 (pedestrian)</label>
        <label><input type="checkbox" data-layer="foot" checked /><span class="sw" style="border-color:#c66a2c;border-top-style:dashed"></span>보행로 (footway / path)</label>
        <label><input type="checkbox" data-layer="steps" checked /><span class="sw" style="border-color:#8e44ad;border-top-style:dotted"></span>계단</label>
        <label><input type="checkbox" data-layer="boundary" /><span class="sw" style="border-color:#e74c3c;border-top-style:dashed"></span>캠퍼스 경계</label>
        <label style="border-top:1px solid #eee;margin-top:4px;padding-top:4px"><input type="checkbox" id="hideHand" /><span class="sw" style="border-color:#f3c248"></span>손으로 그린 기존 도로 숨기기</label>
        <div id="fitInfo" style="font-size:11px;color:#999"></div>
      </div>
    </section>

    <aside class="floor-picker" id="panel" aria-hidden="true">
      <div class="fp-name"><b id="pName">건물명</b><small id="pSub"></small><button class="close" id="closeBtn" title="닫기">✕</button></div>
      <button class="fp-arrow" id="fpUp" title="위층">︿</button>
      <nav class="floor-tabs" id="floorTabs" aria-label="층 선택"></nav>
      <button class="fp-arrow" id="fpDown" title="아래층">﹀</button>
      <div class="room-info" id="roomInfo"><b id="roomName"></b><span id="roomWhere"></span></div>
      <div class="room-hint" id="roomHint"></div>
    </aside>
  </main>

  <script src="data/buildings.js"></script>
  <script src="data/mapFeatures.js"></script>
  <script src="data/footprints.js"></script>
  <script src="data/floorplans.js"></script>
  <script src="data/roadnet.js"></script>
  <script src="renderer.js"></script>
  <script src="app.js"></script>
  <script>
    // ---- OSM 도로망 오버레이 (임시) ----
    (() => {
      const svg = document.getElementById('mapSvg');
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); parent.appendChild(n); return n; };
      const d = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
      // 기존 손그림 도로 그룹에 id 부여 (렌더러가 만든 세 번째 stroke 그룹)
      const hand = [...svg.querySelectorAll('g')].find((g) => g.getAttribute('stroke-linecap') === 'round' && g.getAttribute('fill') === 'none');
      if (hand) hand.id = 'handRoads';
      // 건물 레이어 바로 앞(아래)에 끼워 넣기
      const buildings = svg.getElementById('buildings');
      const layer = el('g', { id: 'osm' }, svg); svg.insertBefore(layer, buildings);
      const groups = { road: el('g', { 'data-layer': 'road' }, layer), ped: el('g', { 'data-layer': 'ped' }, layer), foot: el('g', { 'data-layer': 'foot' }, layer), steps: el('g', { 'data-layer': 'steps' }, layer), boundary: el('g', { 'data-layer': 'boundary', style: 'display:none' }, layer) };
      const roads = ROADNET.ways.filter((w) => w.kind === 'road');
      roads.forEach((w) => el('path', { d: d(w.pts), class: 'osm-road-edge', 'stroke-width': w.hw === 'residential' ? 11 : 7 }, groups.road));
      roads.forEach((w) => el('path', { d: d(w.pts), class: 'osm-road' + (w.hw === 'residential' ? ' main' : ''), 'stroke-width': w.hw === 'residential' ? 8 : 4.5 }, groups.road));
      ROADNET.ways.filter((w) => w.hw === 'pedestrian').forEach((w) => el('path', { d: d(w.pts), class: 'osm-ped', 'stroke-width': 4 }, groups.ped));
      ROADNET.ways.filter((w) => w.kind === 'footway' && w.hw !== 'pedestrian' && w.hw !== 'elevator').forEach((w) => el('path', { d: d(w.pts), class: 'osm-foot', 'stroke-width': 1.4 }, groups.foot));
      ROADNET.ways.filter((w) => w.kind === 'steps').forEach((w) => el('path', { d: d(w.pts), class: 'osm-steps', 'stroke-width': 3 }, groups.steps));
      ROADNET.boundary.forEach((r) => el('path', { d: d(r) + 'Z', class: 'osm-boundary' }, groups.boundary));
      document.querySelectorAll('#osmPanel input[data-layer]').forEach((cb) => cb.addEventListener('change', () => { groups[cb.dataset.layer].style.display = cb.checked ? '' : 'none'; }));
      document.getElementById('hideHand').addEventListener('change', (e) => svg.classList.toggle('hide-hand', e.target.checked));
      document.getElementById('fitInfo').textContent = ROADNET.transform.note;
    })();
  </script>
</body>
</html>
