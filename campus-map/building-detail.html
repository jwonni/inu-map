<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[검토] 건물 실내 배치 · 출입구 — inu-campus-map 기반</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #222; height: 100vh; display: grid; grid-template-rows: 52px 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #e5e8eb; background: #fff; }
  header b { font-size: 16px; } header .tmp { color: #e74c3c; font-size: 12px; } header .hint { color: #888; font-size: 12px; margin-left: auto; }
  header select { height: 32px; border: 1px solid #d5d8dc; border-radius: 6px; padding: 0 8px; font-size: 14px; }
  main { display: grid; grid-template-columns: 1fr 460px; min-height: 0; }
  #map { height: 100%; background: #e9eef5; }
  aside { border-left: 1px solid #e5e8eb; overflow-y: auto; padding: 14px; background: #fafbfc; }
  .floors { display: flex; gap: 6px; margin-bottom: 12px; }
  .floors button { flex: 1; height: 38px; border: 1px solid #d5d8dc; border-radius: 8px; background: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .floors button.on { background: #1e6ff2; border-color: #1e6ff2; color: #fff; }
  .sign { width: 100%; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
  h3 { font-size: 13px; color: #666; margin: 14px 0 6px; }
  .rooms { display: flex; flex-wrap: wrap; gap: 4px; }
  .rooms button { border: 1px solid #c9d6ea; background: #eaf2ff; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  .rooms button.on { background: #ffd54a; border-color: #c98a00; }
  .ents li { font-size: 12px; line-height: 1.7; } .ents .osm { color: #03a05a; } .ents .fix { color: #e67e22; }
  .note { font-size: 12px; color: #777; line-height: 1.6; margin-top: 12px; }
  .note code { background: #eee; padding: 0 4px; border-radius: 3px; }
  .rl { font-size: 11px; font-weight: 700; color: #1f2d4a; white-space: nowrap; transform: translate(-50%,-50%); text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .rl.fx { color: #8a5a12; font-size: 10px; } .rl.wc { color: #1d4f9c; } .rl.area { color: #556; font-weight: 600; } .rl.wing { font-size: 12px; color: #8a93a3; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
<header><b id="title">건물 실내 배치 · 출입구 검토</b><span class="tmp">[검토용]</span>
  <select id="pick"></select>
  <span class="hint">초록 ○ = OSM 출입구 · 주황 ◆ = 배치도 기준 확정 출입구(entrances.js) · 호실/목록 클릭 시 강조</span></header>
<main>
  <div id="map"></div>
  <aside>
    <div class="floors" id="floors"></div>
    <img class="sign" id="sign" alt="안내판 원본">
    <h3>출입구</h3><ul class="ents" id="ents"></ul>
    <h3>호실 목록 (<span id="cnt"></span>)</h3>
    <div class="rooms" id="rooms"></div>
    <div class="note" id="note"></div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/buildings.js"></script>
<script src="data/footprints.js"></script>
<script src="data/floorplans.js"></script>
<script src="data/osm-buildings.js"></script>
<script src="data/entrances.js"></script>
<script src="data/roadnet.js"></script>
<script src="renderer.js"></script>
<script>
(() => {
  const KX = 88700, KY = 111000;
  const rotCorr = Math.atan2(ROADNET.transform.b, ROADNET.transform.a) * 180 / Math.PI;
  const ids = Object.keys(OSM_BUILDINGS).filter((id) => FLOORPLANS[id]);
  const sel = document.getElementById('pick');
  sel.innerHTML = ids.map((id) => `<option value="${id}">${OSM_BUILDINGS[id].no}호관 ${BUILDINGS.find((b) => b.id === id)?.name || ''}</option>`).join('');
  const map = L.map('map', { zoomControl: true, minZoom: 16, maxZoom: 22, zoomSnap: 0.25 });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nobg/{z}/{x}/{y}{r}.png', { maxZoom: 22, attribution: '© OpenStreetMap, © CARTO' }).addTo(map);
  const base = L.layerGroup().addTo(map), layer = L.layerGroup().addTo(map);
  const ST = { room: { fillColor: '#cfe3ff', color: '#5c7cae' }, area: { fillColor: '#e3e7ee', color: '#9aa3b2', dashArray: '3 2' },
    st: { fillColor: '#fbe3b8', color: '#d39a3b' }, wc: { fillColor: '#2f6fd1', color: '#1d4f9c' }, ev: { fillColor: '#dbe7fb', color: '#6f9be0' }, corr: { fillColor: '#e9ecf1', color: '#e9ecf1' } };
  const FX = { st: '계단', wc: 'WC', ev: 'EV' };
  const label = (ll, txt, cls) => L.marker(ll, { interactive: false, icon: L.divIcon({ className: '', iconSize: null, html: `<div class="rl ${cls || ''}">${txt}</div>` }) });
  const polyArea = (p) => { let s = 0; for (let i = 0; i < p.length - 1; i++) s += p[i][1] * KX * (p[i + 1][0] * KY) - p[i + 1][1] * KX * (p[i][0] * KY); return Math.abs(s / 2); };
  let cur = { id: null, floor: null, sel: null, shapes: {}, built: null, toLL: null, L_: null, plan: null };

  function frameFor(id) { // build_indoor.mjs 와 동일한 프레임
    const b = BUILDINGS.find((x) => x.id === id), parts = OSM_BUILDINGS[id].parts;
    const poly = parts.reduce((a, x) => (polyArea(x.poly) > polyArea(a.poly) ? x : a)).poly;
    const P = poly.map(([lat, lon]) => [lon * KX, -lat * KY]);
    const cx0 = P.reduce((s, p) => s + p[0], 0) / P.length, cy0 = P.reduce((s, p) => s + p[1], 0) / P.length;
    let longest = [0, 0]; for (let i = 0; i < P.length - 1; i++) { const dx = P[i + 1][0] - P[i][0], dy = P[i + 1][1] - P[i][1], l = Math.hypot(dx, dy); if (l > longest[0]) longest = [l, Math.atan2(dy, dx)]; }
    const want = ((b.rot || 0) + rotCorr) * Math.PI / 180; let a = longest[1], bd = Infinity;
    for (let k = -2; k <= 2; k++) { const c = longest[1] + k * Math.PI / 2, d = Math.abs(Math.atan2(Math.sin(c - want), Math.cos(c - want))); if (d < bd) { bd = d; a = c; } }
    const ca = Math.cos(a), sa = Math.sin(a); const us = P.map(([x, y]) => (x - cx0) * ca + (y - cy0) * sa), vs = P.map(([x, y]) => -(x - cx0) * sa + (y - cy0) * ca);
    const umin = Math.min(...us), umax = Math.max(...us), vmin = Math.min(...vs), vmax = Math.max(...vs), W = (umax - umin) * .94, H = (vmax - vmin) * .94, uc = (umin + umax) / 2, vc = (vmin + vmax) / 2;
    const toLL = (x, y) => { const u = uc + (x - .5) * W, v = vc + (y - .5) * H; const X = cx0 + u * ca - v * sa, Y = cy0 + u * sa + v * ca; return [-Y / KY, X / KX]; };
    return { toLL, W, H, deg: a * 180 / Math.PI };
  }

  function load(id) {
    const b = BUILDINGS.find((x) => x.id === id), ob = OSM_BUILDINGS[id], plan = FLOORPLANS[id];
    const fr = frameFor(id); const L_ = LAYOUTS[plan.layout];
    cur = { id, floor: null, sel: null, shapes: {}, toLL: fr.toLL, L_, plan, b };
    document.getElementById('title').textContent = `${ob.no}호관 ${b.name} — 실내 배치 · 출입구 검토`;
    base.clearLayers(); layer.clearLayers();
    ob.parts.forEach((p) => L.polygon(p.poly, { color: '#7d776a', weight: 2, fillColor: '#f1ecd9', fillOpacity: 1 }).addTo(base));
    L.polygon(L_.outline.map(([x, y]) => fr.toLL(x, y)), { color: '#1e6ff2', weight: 1.5, dashArray: '4 3', fill: false }).addTo(base);
    const entsEl = document.getElementById('ents'); entsEl.innerHTML = '';
    ob.parts.flatMap((p) => p.ent).forEach((ll, i) => { L.circleMarker(ll, { radius: 5, color: '#03a05a', fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(base).bindTooltip(`OSM 출입구 ${i}`); entsEl.insertAdjacentHTML('beforeend', `<li class="osm">○ OSM 출입구 ${i}</li>`); });
    const fix = ENT_FIX[ob.no];
    if (fix) fix.pts.forEach((ll, i) => { L.marker(ll, { icon: L.divIcon({ className: '', iconSize: null, html: '<div style="width:12px;height:12px;background:#e67e22;border:2px solid #fff;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 2px #000"></div>' }) }).addTo(base).bindTooltip(fix.names?.[i] || '확정 출입구'); entsEl.insertAdjacentHTML('beforeend', `<li class="fix">◆ ${fix.names?.[i] || '확정 출입구 ' + i}</li>`); });
    entsEl.insertAdjacentHTML('beforeend', `<li>${fix ? '확정: ' + fix.note : '아직 OSM 출입구를 그대로 씀 (배치도 좌우 방향 확인 필요)'}</li>`);
    map.fitBounds(L.latLngBounds(ob.parts.flatMap((p) => p.poly)), { padding: [30, 30] });
    const floors = b.floors.map((f) => f.name).filter((f) => plan.floors[f]);
    document.getElementById('floors').innerHTML = floors.map((f) => `<button data-f="${f}">${f}</button>`).join('');
    document.getElementById('note').innerHTML = `프레임 ${fr.W.toFixed(0)}×${fr.H.toFixed(0)}m, 축 ${fr.deg.toFixed(1)}°. 안내판의 왼쪽이 지도에서 어느 쪽인지(좌우 반전 여부)를 OSM 출입구 위치와 안내판의 문 위치를 비교해 확인하세요. 반대면 <code>buildings.js</code> 의 <code>${id}.rot</code> 에 180 을 더합니다.`;
    draw(floors.includes('1F') ? '1F' : floors[0]);
  }
  function draw(f) {
    const { toLL, L_, plan, b, id } = cur; cur.floor = f; cur.sel = null; cur.shapes = {}; layer.clearLayers();
    document.querySelectorAll('#floors button').forEach((x) => x.classList.toggle('on', x.dataset.f === f));
    const signs = (typeof INDOOR_GEN !== 'undefined' && INDOOR_GEN[OSM_BUILDINGS[id].no]?.signs) || null;
    const img = document.getElementById('sign'); img.src = `assets/signs/${id}/${f}.jpg`; img.onerror = () => { img.onerror = null; img.src = `assets/signs/${id}/전체.jpg`; };
    const rect = (c) => [toLL(c.x, c.y), toLL(c.x + c.w, c.y), toLL(c.x + c.w, c.y + c.h), toLL(c.x, c.y + c.h)], mid = (c) => toLL(c.x + c.w / 2, c.y + c.h / 2);
    const built = L_.build(plan.floors[f]);
    built.corridors.forEach((c) => L.polygon(rect(c), { ...ST.corr, weight: 1, fillOpacity: 1, interactive: false }).addTo(layer));
    built.fixtures.forEach((x) => { L.polygon(rect(x), { ...ST[x.type], weight: 1, fillOpacity: 1, interactive: false }).addTo(layer); label(mid(x), FX[x.type], x.type === 'wc' ? 'wc' : 'fx').addTo(layer); });
    const list = document.getElementById('rooms'); list.innerHTML = '';
    built.cells.forEach((c) => {
      const pg = L.polygon(rect(c), { ...(c.kind === 'area' ? ST.area : ST.room), weight: 1, fillOpacity: 1 }).addTo(layer);
      pg.on('click', () => pick(c.id)); cur.shapes[c.id] = pg; label(mid(c), c.id, c.kind === 'area' ? 'area' : '').addTo(layer);
      const btn = document.createElement('button'); btn.textContent = c.id; btn.dataset.id = c.id; btn.onclick = () => { pick(c.id); map.panTo(mid(c)); }; list.appendChild(btn);
    });
    built.labels.forEach((l) => label(toLL(l.x, l.y + 0.03), l.text, 'wing').addTo(layer));
    if (built.entrance) label(toLL(built.entrance.x, built.entrance.y + 0.04), '▲ 입구(레이아웃 기본값)', 'fx').addTo(layer);
    document.getElementById('cnt').textContent = built.cells.length + '개';
  }
  function pick(id) {
    if (cur.sel && cur.shapes[cur.sel]) cur.shapes[cur.sel].setStyle({ fillColor: '#cfe3ff', color: '#5c7cae' });
    cur.sel = id; if (cur.shapes[id]) cur.shapes[id].setStyle({ fillColor: '#ffd54a', color: '#c98a00' });
    document.querySelectorAll('#rooms button').forEach((x) => x.classList.toggle('on', x.dataset.id === id));
  }
  document.getElementById('floors').onclick = (e) => { const x = e.target.closest('button'); if (x) draw(x.dataset.f); };
  sel.onchange = () => { location.hash = sel.value; load(sel.value); };
  const start = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'it';
  sel.value = start; load(start);
  window._bd = { load, draw, pick, map };
})();
</script>
</body>
</html>
