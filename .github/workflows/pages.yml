# main 에 push 할 때마다 campus-map/ 폴더를 GitHub Pages 로 배포
#   주소: https://jwonni.github.io/inu-map/
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두어야 합니다
# (아래 enablement 옵션이 자동으로 켜 주지만, 실패하면 수동으로).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: campus-map
      - id: deployment
        uses: actions/deploy-pages@v4
